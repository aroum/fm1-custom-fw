[project]
name = "fm1-flasher"
version = "0.1.0"
description = "FM-1 Synthesizer OTA Firmware Flasher & Preset Utility"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mido>=1.3.3",
    "python-rtmidi>=1.5.8",
    "tqdm>=4.69.1",
]

[project.scripts]
fm1-flasher = "fm1_flasher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
