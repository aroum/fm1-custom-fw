name: Issue Auto-Labeler

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply short labels
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const labels = new Set();

            if (/- \[x\] (Custom Firmware|Modular Platform|Game \/ Emulator)/i.test(body)) {
              labels.add('fw');
            }
            if (/- \[x\] (Flasher|Emulator \/ Simulator|Web Editor|Article)/i.test(body)) {
              labels.add('tools');
            }
            if (/- \[x\] Hardware Mod/i.test(body)) {
              labels.add('hw');
            }
            if (body.includes('REVERSE_ENGINEERING.md')) {
              labels.add('re');
            }
            if (body.includes('OFFICIAL_FIRMWARE.md')) {
              labels.add('stock');
            }

            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: Array.from(labels)
              });
            }
